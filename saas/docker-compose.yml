version: '3.8'

services:
  persona-studio:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "6967:6967"
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - PERSONA_ENGINE_URL=http://localhost:6967
      - PERSONA_DEVICE=cuda
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - DOMAIN=${DOMAIN:-*}
    volumes:
      - persona-data:/app/data
      - persona-uploads:/app/uploads
      - persona-db:/app/saas/backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/auth/login"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  persona-data:
    driver: local
  persona-uploads:
    driver: local
  persona-db:
    driver: local
