
name: Bug Report
about: Create a report to help us improve
labels: bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware / GPU
      description: e.g. RTX 4070, Apple M3, CPU only
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit
    validations:
      required: true