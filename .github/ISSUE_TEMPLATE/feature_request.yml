
name: Feature Request
about: Suggest an idea for this project
labels: enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Is your feature request related to a problem?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What alternatives have you considered?
  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      options:
        - persona-swap-core
        - video-animate
        - scene-composer
        - semantic-scene
        - cross-modal
        - on-device-engine
        - sdk
        - no-code-pipeline
        - shared