services:
  - type: web
    name: persona-studio
    runtime: docker
    region: oregon
    plan: free
    # Only run the SaaS web backend on Render's CPU/free tier.
    # (The GPU persona engine is not started here; engine endpoints
    #  return a graceful 503 "engine unavailable" instead of raw errors.)
    dockerCommand: uvicorn saas.backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DOMAIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: PERSONA_ENGINE_URL
        value: http://localhost:6967
      - key: PERSONA_DEVICE
        value: cpu
