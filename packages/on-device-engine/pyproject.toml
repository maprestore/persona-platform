[project]
name = "on-device-engine"
version = "0.1.0"
description = "Runtime optimizer: ONNX/TensorRT/CoreML quantization"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "shared",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.15"]
all = [
    "on-device-engine[onnx]",
    "tensorrt; platform_system == 'Linux'",
    "coremltools; platform_system == 'Darwin'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]