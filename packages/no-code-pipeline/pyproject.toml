[project]
name = "no-code-pipeline"
version = "0.1.0"
description = "Drag-and-drop pipeline builder (React Flow backend)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.100",
    "pydantic>=2.0",
    "shared @ file://${PROJECT_ROOT}/../shared",
]

[project.optional-dependencies]
all = ["networkx", "graphviz"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]