
[project]
name = "video-animate"
version = "0.1.0"
description = "Animated avatar puppeteering from face/body/voice"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "torch>=2.0",
    "shared @ file://../shared",
]

[project.optional-dependencies]
all = ["mediapipe"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]