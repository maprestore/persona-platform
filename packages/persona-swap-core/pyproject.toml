
[project]
name = "persona-swap-core"
version = "0.1.0"
description = "Real-time face/body/voice swap engine"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "torch>=2.0",
    "pillow>=10.0",
    "shared @ file://../shared",
    "librosa>=0.10",
    "scipy>=1.10",
]

[project.optional-dependencies]
all = [
    "insightface>=0.7; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "onnxruntime-gpu; platform_system == 'Linux' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "onnxruntime; platform_system == 'Windows' or platform_system == 'Darwin'",
    "gfpgan",
    "pydub",
    "whisper",
    "rembg",
    "soundfile",
    "torchcrepe",
    "mediapipe",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]