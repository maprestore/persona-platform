[project]
name = "cross-modal"
version = "0.1.0"
description = "Text/audio to face/body generation"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "shared @ file://${PROJECT_ROOT}/../shared",
]

[project.optional-dependencies]
all = ["transformers", "diffusers", "whisper"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]